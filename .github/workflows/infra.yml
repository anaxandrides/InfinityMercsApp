# Creates or updates the Azure resources from infra/. Signs in to Azure with OIDC as the deploy identity described
# in docs/azure-setup.md; there are no secrets.
name: Infrastructure

on:
  push:
    branches: [main]
    paths:
      - infra/**
      - .github/workflows/infra.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency: infrastructure

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infra/main.bicep
        run: >
          az deployment sub create
          --name "infra-${{ github.run_number }}"
          --location eastus
          --template-file infra/main.bicep
          --parameters infra/main.bicepparam
