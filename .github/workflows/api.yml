# Tests the API, and on main deploys it to the Function app and refreshes the army data mirror.
name: API

on:
  push:
    branches: [main]
    paths:
      - InfinityMercsApp.Api/**
      - InfinityMercsApp.ApiClient/**
      - InfinityMercsApp.Infrastructure/**
      - InfinityMercsApp.Domain/**
      - tests/InfinityMercsApp.Api.UnitTests/**
      - .github/workflows/api.yml
  pull_request:
    paths:
      - InfinityMercsApp.Api/**
      - InfinityMercsApp.ApiClient/**
      - InfinityMercsApp.Infrastructure/**
      - InfinityMercsApp.Domain/**
      - tests/InfinityMercsApp.Api.UnitTests/**
      - .github/workflows/api.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  # The resource group infra/main.bicep creates.
  RESOURCE_GROUP: rg-infmercs-prod

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/InfinityMercsApp.Api.UnitTests

      - name: Publish
        run: dotnet publish InfinityMercsApp.Api -c Release -o publish

      - uses: actions/upload-artifact@v7
        with:
          name: api
          path: publish
          include-hidden-files: true

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    concurrency: api-deploy
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: api
          path: publish

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Find the Function app
        id: app
        run: echo "name=$(az functionapp list -g "$RESOURCE_GROUP" --query '[0].name' -o tsv)" >> "$GITHUB_OUTPUT"

      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.app.outputs.name }}
          package: publish
          sku: flexconsumption

      # Fills the mirror straight away instead of waiting up to six hours for the timer.
      - name: Refresh the army data
        run: |
          # The host's master key, read with the deploy identity's sign-in and masked in the log.
          key=$(az functionapp keys list -g "$RESOURCE_GROUP" -n "${{ steps.app.outputs.name }}" --query masterKey -o tsv)
          echo "::add-mask::$key"
          # Read from the site resource itself: az functionapp show leaves defaultHostName empty for a Flex Consumption
          # app, whose host name may also carry a generated suffix and region rather than being just the app's name.
          host=$(az resource show -g "$RESOURCE_GROUP" -n "${{ steps.app.outputs.name }}" --resource-type Microsoft.Web/sites \
            --query properties.defaultHostName -o tsv)
          if [ -z "$host" ]; then
            echo "::error::Could not read the Function app's host name."
            exit 1
          fi
          echo "Refreshing the army data on $host"
          curl --fail-with-body -sS -X POST "https://$host/admin/functions/RefreshArmyData" \
            -H "x-functions-key: $key" -H "Content-Type: application/json" -d '{"input":""}'
